[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radixnet"
version = "0.1.0"
description = "Self-compressing cyclic-graph neural network (Radix Tree inspired): the core model - the graph, its four kinds, the encodings, training, the searches and the model file. Pure Python, optional torch acceleration. The command line, the HTTP API, the frontend and the teaching loops built around it are the modelkit package (../ModelKit)."
readme = "README.md"
requires-python = ">=3.11"
# Licensed under the custom source-available license in ../LICENSE (repository root).
dependencies = []

[project.optional-dependencies]
gpu = ["torch"]

[project.scripts]
# the command line is modelkit's (../ModelKit): install that package too, or keep its checkout beside this one
radixnet = "radixnet.__main__:main"

[tool.setuptools]
packages = ["radixnet"]
