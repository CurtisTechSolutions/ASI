[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radixnet"
version = "0.1.0"
description = "Self-compressing cyclic-graph neural network (Radix Tree inspired) with a sine activation, Dijkstra prediction, 2NRL and GAN-style self-upgrading. Pure Python, optional torch acceleration."
readme = "README.md"
requires-python = ">=3.11"
# Licensed under the custom source-available license in ../LICENSE (repository root).
dependencies = []

[project.optional-dependencies]
gpu = ["torch"]
images = ["pillow"]
diffusion = ["pillow", "torch", "diffusers"]
# Speech to text; the waveform encoder itself needs nothing, and the browser's
# Web Speech API (or --text) supplies the words without any of these.
speech = ["faster-whisper"]
# The acoustic units' neural vocoder (D-090) runs on the standard library; numpy makes a reply's
# audio take milliseconds instead of seconds, and is what training one needs.
vocoder = ["numpy"]
whisper = ["openai-whisper"]

[project.scripts]
radixnet = "radixnet.cli:main"

[tool.setuptools]
packages = ["radixnet"]
