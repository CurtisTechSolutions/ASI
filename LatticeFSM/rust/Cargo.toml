# latticefsm (Rust) - a finite state machine over a dense 3D matrix of adaptive edges.
#
# No dependencies from outside this repository, on purpose, like the other
# crates in it: the Python implementation beside it is pure standard library,
# and so is this one.  Everything it needs - JSON, the RNG, the HTTP/1.1
# server - is written out in src/; the one dependency is the repository's own
# phonetic tokenizer (../../PhoneticTokenizer/rust, itself standard library
# only), which the network's encoder and decoder read and write English with.
[package]
name = "latticefsm"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A finite state machine over a dense 3D matrix of adaptive edges, with a CLI and an HTTP server"
license = "LicenseRef-ASI"
publish = false

[lib]
name = "latticefsm"
path = "src/lib.rs"

[[bin]]
name = "latticefsm"
path = "src/bin/latticefsm.rs"

[dependencies]
phonetok = { path = "../../PhoneticTokenizer/rust" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
